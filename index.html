<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ADHD傾向セルフチェック（15歳向け）</title>
<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.75}
main{max-width:600px;margin:0 auto;padding:16px 14px 56px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:22px 18px;box-shadow:0 6px 24px rgba(40,50,120,.07)}

h2{font-size:1.1rem;margin:0}
h3{font-size:1rem;margin:26px 0 8px;padding-left:10px;border-left:4px solid var(--ac)}
p{margin:8px 0}
ul{margin:6px 0;padding-left:1.2em}
li{margin:4px 0}
.sub{color:var(--sub);font-size:.88rem}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:16px;padding:20px 16px;margin-bottom:14px}
.hero h1{font-size:1.5rem}
.hero p{margin:4px 0;opacity:.95}
.btn{display:block;width:100%;padding:14px 16px;margin-top:10px;border:1px solid var(--ln);border-left:6px solid var(--c,var(--ln));border-radius:14px;background:var(--card);color:var(--tx);font-size:1rem;text-align:left;cursor:pointer;font-family:inherit;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.main{background:var(--ac);color:#fff;border:0;text-align:center;font-weight:700;font-size:1.05rem;padding:16px}
.btn.ghost{text-align:center;color:var(--sub);border-left-width:1px}
.btn.big{padding:18px 16px;font-size:1.05rem}
.btn.sel{background:var(--c);color:#fff;border-color:var(--c);animation:bump .18s}
@keyframes bump{50%{transform:scale(1.05)}}
.row{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;gap:8px}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.95rem;margin:6px 0}
.cmb{color:var(--ac2);display:inline-block;transition:transform .15s}
.cmb.pop{transform:scale(1.5)}
.snd{background:none;border:0;font-size:1.2rem;cursor:pointer;color:var(--tx);padding:0}
.tag{display:inline-block;font-size:.75rem;padding:2px 10px;border-radius:99px;background:var(--ln);color:var(--sub)}
.seg{display:flex;gap:6px;margin:8px 0}
.seg i{flex:1;height:8px;border-radius:99px;background:var(--ln);overflow:hidden;position:relative}
.seg b{position:absolute;inset:0;width:0;background:var(--ac);transition:width .25s}
.cheer{min-height:1.6em;color:var(--ac);font-weight:700;text-align:center;margin-top:10px}
.q{font-size:1.18rem;font-weight:700;margin:6px 0 8px;min-height:4.4em}
.bar{height:10px;background:var(--ln);border-radius:99px;overflow:hidden;margin:4px 0 12px}
.bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.b i{background:var(--ac2)}
.note{font-size:.82rem;color:var(--sub);border-left:3px solid var(--ln);padding-left:10px;margin-top:16px}
.fl{position:fixed;pointer-events:none;font-weight:800;font-size:1.2rem;color:var(--ac2);animation:fl .8s ease-out forwards;z-index:30}
@keyframes fl{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-70px) scale(1.5)}}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.badge{display:inline-block;margin:5px 3px;padding:6px 14px;border-radius:99px;background:var(--ac);color:#fff;font-weight:700;font-size:.88rem;animation:pp .5s ease both}
@keyframes pp{from{transform:scale(0)}to{transform:scale(1)}}

.tabs button{flex:1;border:0;background:none;color:var(--sub);padding:9px 2px;border-radius:10px;font-size:.88rem;font-weight:700;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ac);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.hero2{text-align:center;padding:8px 0}
.big{font-size:3rem;font-weight:800;line-height:1.1;color:var(--ac)}
.big small{font-size:1rem;color:var(--sub);font-weight:400}
.pill{display:inline-block;padding:3px 14px;border-radius:99px;background:var(--ac2);color:#fff;font-weight:700;font-size:.85rem}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--sub);justify-content:center;margin-top:6px}
.tc{border:1px solid var(--ln);border-radius:14px;padding:14px;margin:12px 0}
.tc h2{display:flex;justify-content:space-between;gap:8px;font-size:1rem}
.str{font-size:.88rem;color:var(--sub);margin-top:6px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.acts .btn{margin:0;text-align:center;border-left-width:1px}
@media print{.nop,.tabs{display:none}}
.hide{display:none}
</style>
</head>
<body>
<main>
<section class="card" id="start">
<div class="hero">
<h1>🧠 ADHD傾向セルフチェック</h1>
<p>15歳向け・全30問・約5分</p>
</div>
<p>最近（ここ半年くらい）の自分にどれくらい当てはまるかを選んでください。正解や不正解はありません。</p>
<p class="sub">答えるほどXPが貯まり、テンポよく答えると🔥コンボが伸びます！10問ごとに短い休憩があり、途中でやめても続きから再開できます。結果は6つの分野に分けて、くわしく表示されます。</p>
<p class="note">これは医療的な診断ではありません。自分の特徴を知るための目安です。つらさや困りごとが続くときは、保護者・学校の先生・スクールカウンセラー・医療機関に相談してください。回答は端末の外には送信されません。</p>
<button class="btn main" id="go">はじめる</button>
<button class="btn ghost hide" id="resume">続きから再開する</button>
</section>

<section class="card hide" id="quiz">
<div class="row"><span class="tag" id="cat"></span><span class="sub" id="cnt"></span></div>
<div class="hud"><span id="xp"></span><span class="cmb" id="cb"></span><button class="snd" id="sn">🔊</button></div>
<div class="seg"><i><b id="sg0"></b></i><i><b id="sg1"></b></i><i><b id="sg2"></b></i></div>
<div class="cheer" id="ch"></div>
<div class="q" id="qt"></div>
<div id="opts"></div>
<button class="btn ghost" id="back">← ひとつ戻る</button>
</section>

<section class="card hide" id="rest" style="text-align:center">
<h1 id="rt"></h1>
<div id="rb"></div>
<p id="rm"></p>
<button class="btn main" id="rgo">つづける</button>
</section>

<section class="card hide" id="result">
<div class="tabs" id="tabs"></div>
<div id="tcnt"></div>
<div class="acts nop">
<button class="btn" id="copy">📋 結果をコピー</button>
<button class="btn" id="prt">🖨 印刷・PDF</button>
</div>
<button class="btn ghost nop" id="retry">もう一度やる</button>
</section>
</main>
<canvas id="cf"></canvas>

function beep(f,d,t){
if(!snd)return;
try{
ac=ac||new (window.AudioContext||window.webkitAudioContext)();
const o=ac.createOscillator(),g=ac.createGain();
o.type=t||"sine";
o.frequency.value=f;
g.gain.setValueAtTime(.12,ac.currentTime);
g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
o.connect(g);
g.connect(ac.destination);
o.start();
o.stop(ac.currentTime+d);
}catch(e){}
}
function fanfare(){[523,659,784,1047].forEach((f,k)=>setTimeout(()=>beep(f,.25,"triangle"),k*110))}
function boom(n){
const c=$("cf"),x=c.getContext("2d");

const cols=["#5b6cff","#ff8a5b","#ffd23f","#3ddc97","#ff5fa2"];

(function step(){
x.clearRect(0,0,c.width,c.height);
ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
if(++f<110)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height);
})();
}
function fl(t,el){

const d=document.createElement("div");
d.className="fl";
d.textContent=t;
d.style.left=(r.left+r.width/2-16)+"px";
d.style.top=r.top+"px";
document.body.appendChild(d);
setTimeout(()=>d.remove(),800);
}

[0,1,2].forEach(s=>{$("sg"+s).style.width=Math.max(0,Math.min(1,(i-s*10)/10))*100+"%"});
$("qt").textContent=QS[i][1];
const o=$("opts");
o.innerHTML="";
OP.forEach((t,v)=>{
const b=document.createElement("button");
b.className="btn big";
b.style.setProperty("--c",OC[v]);
b.textContent=(v+1)+"　"+t;
b.onclick=()=>pick(v,b);
o.appendChild(b);
});
$("back").style.visibility=i?"visible":"hidden";
}
function pick(v,b){
if(lock)return;
lock=true;
ans[i]=v;
if(b)b.classList.add("sel");
reward(b);
try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
setTimeout(()=>{
lock=false;
if(i>=QS.length-1){finish();return}
i++;
save();
if(i%10===0)rest();else render();
},180);
}
function rest(){
$("rt").textContent="LEVEL UP！ Lv."+(i/10+1);
const bd=BG[i/10-1];
got.push(bd);
$("rb").innerHTML='<span class="badge">'+bd+'</span>';
$("rm").textContent="あと"+(QS.length-i)+"問です。ここで30秒だけ、立って伸びをしたり、水を飲んだりしてもOK。";
lastT=0;
show("rest");
boom();
fanfare();
}
function save(){try{localStorage.setItem("adhd15",JSON.stringify({i,ans}))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem("adhd15"))}catch(e){return null}}
function clearSave(){try{localStorage.removeItem("adhd15")}catch(e){}}
const lvl=p=>p<25?0:p<50?1:p<70?2:3;
const dl=p=>p<34?0:p<67?1:2;
function radar(v){
const c=130,R0=88,n=v.length;
const pt=(k,r)=>{const a=-Math.PI/2+k*2*Math.PI/n;return[c+r*Math.cos(a),c+r*Math.sin(a)]};
let g="";
[.33,.66,1].forEach(f=>{g+='<polygon points="'+v.map((_,k)=>pt(k,R0*f).join(",")).join(" ")+'" fill="none" stroke="var(--ln)"/>'});
v.forEach((_,k)=>{
const[x,y]=pt(k,R0);
g+='<line x1="'+c+'" y1="'+c+'" x2="'+x+'" y2="'+y+'" stroke="var(--ln)"/>';
const[lx,ly]=pt(k,R0+22);
g+='<text x="'+lx+'" y="'+ly+'" text-anchor="middle" dominant-baseline="middle" font-size="16">'+TH[k].e+'</text>';
});
g+='<polygon points="'+v.map((p,k)=>pt(k,R0*Math.max(.04,p/100)).join(",")).join(" ")+'" fill="var(--ac)" fill-opacity=".3" stroke="var(--ac)" stroke-width="2"/>';
return'<svg viewBox="0 0 260 260" width="100%" style="max-width:280px;display:block;margin:auto">'+g+'</svg>';
}
function bar(n,v,m,p,c){
return'<div class="row"><span>'+n+'</span><span>'+v+' / '+m+'（'+LV[lvl(p)]+'）</span></div><div class="bar '+c+'"><i data-w="'+p+'"></i></div>';
}
const PEER="思春期は、睡眠不足、不安やストレス、気分の落ちこみ、スマホやゲームの使いすぎ、勉強のつまずきなどでも、ADHDに似た状態になることがあります。このチェックだけでは原因は分かりません。";
function o0(){
const ty=T[R.ty];
const bl=got.concat(["🏆 クリア達成","⭐ "+xp+" XP"]);
if(best>=5)bl.push("🔥 最大 ×"+best+" コンボ");
return'<div class="hero2"><div class="sub">総合スコア</div><div class="big"><span id="sc">0</span><small> / 90</small></div><span class="pill">'+LV[lvl(R.pt)]+'</span><h2 style="margin:14px 0 4px">'+ty[0]+'</h2><p style="text-align:left">'+ty[1]+'</p></div>'
+'<div style="text-align:center">'+bl.map((t,k)=>'<span class="badge" style="animation-delay:'+(k*.15)+'s">'+t+'</span>').join("")+'</div>'
+'<h3>6つの分野のバランス</h3>'+radar(R.th.map(x=>x.p))
+'<div class="lg">'+TH.map((t,k)=>'<span>'+t.e+' '+t.t+' '+R.th[k].p+'%</span>').join("")+'</div>'
+'<h3>2つの軸</h3>'+bar("不注意",R.a,45,R.pa,"")+bar("多動・衝動性",R.h,45,R.ph,"b")
+'<h3>特に強く当てはまった項目</h3>'+(R.top.length?'<ul>'+R.top.map(x=>'<li>'+x+'</li>').join("")+'</ul>':'<p>「ほとんどいつも」と答えた項目はありませんでした。</p>')
+'<p class="note">'+PEER+'</p>';
}
function o1(){
return'<p class="sub">分野ごとの点数と、当てはまりやすい場面です。「よくある」以上の項目も書いてあります。</p>'+TH.map((t,k)=>{
const x=R.th[k];
return'<div class="tc"><h2><span>'+t.e+' '+t.t+'</span><span>'+x.s+' / 15</span></h2><div class="bar"><i data-w="'+x.p+'"></i></div><p>'+t.d[dl(x.p)]+'</p>'
+(x.its.length?'<ul>'+x.its.map(y=>'<li>'+y+'</li>').join("")+'</ul>':"")
+'<p class="str">💪 '+t.s+'</p></div>';
}).join("");
}
function o2(){
const top=R.th.map((x,k)=>({k,p:x.p})).filter(x=>x.p>=34).sort((a,b)=>b.p-a.p).slice(0,3);
let h='<p class="sub">困りやすい分野から、できそうなものを1つだけ選んで1週間試してみましょう。全部やる必要はありません。</p>';
if(top.length){
top.forEach((x,n)=>{h+='<div class="tc"><h2><span>'+(n+1)+'. '+TH[x.k].e+' '+TH[x.k].t+'</span><span>'+x.p+'%</span></h2><ul>'+TH[x.k].tp.map(y=>'<li>'+y+'</li>').join("")+'</ul></div>'});
}else{
h+='<div class="tc"><p>どの分野も困りごとは少なめでした。今の習慣を続けましょう。もし気になる分野があれば「分野別」のタブを見てみてください。</p></div>';
}
h+='<h3>どの分野にも効く土台づくり</h3><div class="tc"><ul>'
+'<li><b>睡眠</b>：寝る時間と起きる時間を毎日そろえる。寝る1時間前にはスマホを置く</li>'
+'<li><b>運動</b>：1日10〜20分でも体を動かすと、集中や気分が安定しやすい</li>'
+'<li><b>食事</b>：朝ごはんを抜かない。甘い飲み物やカフェインのとりすぎに注意</li>'
+'<li><b>環境</b>：机の上には今やることだけ置く。タイマーや時計を目に見える所に置く</li>'
+'<li><b>ごほうび</b>：終わったらすぐ小さなごほうびを。「できた」を目に見える形で残す</li>'
+'<li><b>人に頼る</b>：苦手は隠さず、「こうしてもらえると助かる」と身近な人に伝える</li>'
+'</ul></div>';
return h;
}
function o3(){
return'<h3>相談したほうがいいサイン</h3><div class="tc"><ul>'
+'<li>当てはまる状態が、半年以上続いている</li>'
+'<li>学校だけ、家だけでなく、いくつかの場面で困っている</li>'
+'<li>成績、友だち関係、家での生活に、はっきり影響が出ている</li>'
+'<li>自分を責めてしまう、落ちこむ、眠れないなど、つらい気持ちが強い</li>'
+'</ul><p class="sub">ひとつでも当てはまるなら、一人で抱えず相談してみてください。点数が低くても、困っていれば相談してよいのです。</p></div>'
+'<h3>相談先の例</h3><div class="tc"><ul>'
+'<li>保護者・家族（まず話しやすい人から）</li>'
+'<li>担任の先生、養護教諭（保健室の先生）、スクールカウンセラー</li>'
+'<li>小児科、児童精神科、心療内科、精神科（18歳未満は児童精神科・小児科が相談しやすい）</li>'
+'<li>お住まいの地域の発達障害者支援センター、精神保健福祉センター</li>'
+'</ul></div>'
+'<h3>相談するときのコツ</h3><div class="tc"><ul>'
+'<li>この結果の画面を見せるか、「結果をコピー」で内容を渡す</li>'
+'<li>「いつ、どんな場面で、どう困るか」を具体的に3つ書き出しておく</li>'
+'<li>小さい頃からの様子（通知表の所見など）も参考になる</li>'
+'<li>診断は、問診・生活の様子・ほかの要因なども含めて、専門家が総合的に行うもの</li>'
+'</ul></div><p class="note">'+PEER+'つらい気持ちが強いときは、すぐに信頼できる大人に話してください。</p>';
}
const OPN=[o0,o1,o2,o3];
const TN=["まとめ","分野別","工夫","相談"];
function tab(n){
tabNo=n;
$("tabs").innerHTML="";
TN.forEach((t,k)=>{
const b=document.createElement("button");
b.textContent=t;
if(k===n)b.className="on";
b.onclick=()=>{tab(k);window.scrollTo(0,0)};
$("tabs").appendChild(b);
});
$("tcnt").innerHTML=OPN[n]();
setTimeout(()=>document.querySelectorAll("[data-w]").forEach(e=>{e.style.width=e.dataset.w+"%"}),80);
if(n===0)cu($("sc"),R.a+R.h,n=>n);
}
function finish(){
let a=0,h=0;
const ths=TH.map(()=>({s:0,its:[]}));
QS.forEach((q,k)=>{
const v=ans[k];
if(q[0]==="a")a+=v;else h+=v;
const ix=TH.findIndex(t=>t.k===q[2]);
ths[ix].s+=v;
if(v>=2)ths[ix].its.push(q[1]+"（"+OP[v]+"）");
});
ths.forEach(x=>{x.p=Math.round(x.s/15*100)});
const pa=Math.round(a/45*100),ph=Math.round(h/45*100),pt=Math.round((a+h)/90*100);
let ty=3;
if(pt<30)ty=0;else if(Math.abs(pa-ph)>=15)ty=pa>ph?1:2;
const top=[];
QS.forEach((q,k)=>{if(ans[k]===3)top.push(q[1])});
R={a,h,pa,ph,pt,th:ths,ty,top:top.slice(0,8)};
clearSave();
tab(0);
show("result");
boom(160);
fanfare();
}
function summary(){
const L=["【ADHD傾向セルフチェック結果（15歳向け）】","総合: "+(R.a+R.h)+"/90（"+LV[lvl(R.pt)]+"）／不注意: "+R.a+"/45／多動・衝動性: "+R.h+"/45","タイプ: "+T[R.ty][0],"","【分野別】"];
TH.forEach((t,k)=>L.push("・"+t.t+": "+R.th[k].s+"/15（"+LV[lvl(R.th[k].p)]+"）"));
L.push("","【「よくある」以上の項目】");
R.th.forEach(x=>x.its.forEach(y=>L.push("・"+y)));
L.push("","※診断ではありません。相談のときの参考にしてください。");
return L.join("\n");
}
$("go").onclick=()=>{clearSave();rs();i=0;ans=[];render();show("quiz");beep(660,.15,"triangle")};
const sv=load();
if(sv&&Array.isArray(sv.ans)&&sv.ans.length&&sv.i>0&&sv.i<QS.length)$("resume").classList.remove("hide");
$("resume").onclick=()=>{rs();i=sv.i;ans=sv.ans;xp=ans.length*12;render();show("quiz")};
$("rgo").onclick=()=>{render();show("quiz")};
$("back").onclick=()=>{if(i>0){i--;render()}};
$("retry").onclick=()=>{clearSave();rs();i=0;ans=[];$("resume").classList.add("hide");show("start")};
$("sn").onclick=()=>{snd=!snd;$("sn").textContent=snd?"🔊":"🔇"};
$("prt").onclick=()=>{window.print()};
$("copy").onclick=async()=>{
try{await navigator.clipboard.writeText(summary());$("copy").textContent="✅ コピーしました"}catch(e){$("copy").textContent="コピーできませんでした"}
setTimeout(()=>{$("copy").textContent="📋 結果をコピー"},2000);
};
document.addEventListener("keydown",e=>{
if($("quiz").classList.contains("hide"))return;
const n=parseInt(e.key,10);
if(n>=1&&n<=4){const bs=$("opts").children;pick(n-1,bs[n-1])}
});
</script>
